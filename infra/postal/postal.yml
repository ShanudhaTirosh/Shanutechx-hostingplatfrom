# Postal configuration. Mounted read-only into postal-web/postal-smtp/
# postal-worker in docker-compose.local.yml.
#
# HONEST NOTE: this is hand-written to match Postal's documented config
# schema (docs.postalserver.io/getting-started/configuration) as of this
# writing, since Postal's normal setup flow is to run `postal
# initialize-config` interactively on a real host to generate this file
# plus signing.key/certs -- that CLI-driven generation can't be replicated
# inside a docker-compose file. If postal-web fails to start, check its
# logs first and cross-check the exact keys below against Postal's own
# docs for the image tag you're running; a few key names have shifted
# across Postal's major versions.
#
# ONE-TIME MANUAL STEPS (can't be automated by docker compose up):
#   1. Generate infra/postal/signing.key (referenced below):
#        openssl genrsa -out infra/postal/signing.key 2048
#   2. Set web_hostname / smtp_hostname below to your real mail domain,
#      with DNS (A/AAAA + reverse DNS/PTR) already pointed at this
#      server's public IP -- Postal will refuse to deliver mail
#      reliably otherwise, and this can't be skipped or faked.
#   3. After first `docker compose up -d`:
#        docker compose exec postal-web postal initialize
#        docker compose exec postal-web postal make-user
#      then log into http://localhost:5010, create an Organization +
#      Mail Server, and copy its API key into apps/api/.env as
#      POSTAL_API_KEY.

web_hostname: mail.shanutechx.local
web_protocol: http
smtp_hostname: mail.shanutechx.local

main_db:
  host: postal-db
  username: root
  password: CHANGE_ME_postal_db_root_pass # must match POSTAL_DB_ROOT_PASSWORD in infra/postal/.env
  database: postal

message_db:
  host: postal-db
  username: root
  password: CHANGE_ME_postal_db_root_pass # must match POSTAL_DB_ROOT_PASSWORD in infra/postal/.env
  prefix: postal

rails:
  secret_key_base: CHANGE_ME_generate_with_openssl_rand_hex_64

general:
  use_ip_pools: false

smtp_server:
  default:
    port: 25

web_server:
  default_port: 5000
  bind_address: "0.0.0.0"

dns:
  mx_records:
    - mx.shanutechx.local
  smtp_server_hostname: mail.shanutechx.local
  spf_include: spf.shanutechx.local
  return_path: rp.shanutechx.local
  track_domain: track.shanutechx.local
  helo_hostname: shanutechx.local
