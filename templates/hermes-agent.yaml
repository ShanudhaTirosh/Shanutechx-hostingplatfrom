# name: Hermes AI Agent
# slogan: Autonomous AI agent framework with web UI, vector memory store, and tool execution engine
# documentation: https://docs.shanutechx.com/templates/hermes-agent
# category: ai
# tags: ai,agent,hermes,llm,python,langchain
# logo: https://raw.githubusercontent.com/walkxlk/assets/main/hermes-agent.png
# port: 8080
# defaultInternalPort: 8080
# requiresExposedPort: true
# recommendedExposureMode: ssl_with_proxy

version: '3.8'

services:
  hermes-agent:
    image: hermesagent/hermes-agent:latest
    restart: unless-stopped
    environment:
      - PORT=8080
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HERMES_SECRET_KEY=${HERMES_SECRET_KEY:?HERMES_SECRET_KEY is required}
      - REDIS_URL=redis://hermes-redis:6379
      - VECTOR_STORE_URL=http://hermes-vector:6333
    networks:
      - default
      - shanutechx-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shanutechx-public"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=le"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      hermes-redis:
        condition: service_healthy
      hermes-vector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  hermes-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  hermes-vector:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  redis_data:
  qdrant_data:

networks:
  shanutechx-public:
    external: true
