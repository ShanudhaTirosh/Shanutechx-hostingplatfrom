# name: LiveKit WebRTC Server
# slogan: Real-time audio and video WebRTC server for apps.
# documentation: https://docs.shanutechx.com/templates/livekit
# category: communication
# tags: livekit, webrtc, video, audio, streaming, voice
# logo: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/livekit.svg
# port: 7880
# defaultInternalPort: 7880
# requiresExposedPort: true
# recommendedExposureMode: ssl_with_proxy

version: '3.8'

services:
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - default

  livekit:
    image: livekit/livekit-server:v1.7
    command: --config /etc/livekit.yaml
    restart: always
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - livekit_data:/data
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set}:${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - default
      - shanutechx-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shanutechx-public"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=le"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=7880"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:7880/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

volumes:
  livekit_data:

networks:
  shanutechx-public:
    external: true
