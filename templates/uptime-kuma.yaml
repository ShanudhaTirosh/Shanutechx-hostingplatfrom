# name: Uptime Kuma
# slogan: A fancy self-hosted monitoring tool and public status page engine
# documentation: https://docs.shanutechx.com/templates/uptime-kuma
# category: analytics
# tags: uptime,monitoring,kuma,status-page,metrics
# logo: https://raw.githubusercontent.com/walkxlk/assets/main/uptime-kuma.png
# port: 3001
# defaultInternalPort: 3001
# requiresExposedPort: true
# recommendedExposureMode: ssl_with_proxy

version: '3.8'

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - kuma-data:/app/data
    networks:
      - default
      - shanutechx-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shanutechx-public"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=le"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  kuma-data:

networks:
  shanutechx-public:
    external: true
