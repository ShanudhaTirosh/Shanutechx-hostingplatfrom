# name: Redis In-Memory Cache
# slogan: Fast, in-memory data store, cache, and message broker.
# documentation: https://docs.shanutechx.com/templates/redis
# category: database
# tags: redis, cache, key-value, database, nosql
# logo: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/redis.svg
# port: 6379
# defaultInternalPort: 6379
# requiresExposedPort: true
# recommendedExposureMode: raw_tcp

version: '3.8'

services:
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel notice --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

