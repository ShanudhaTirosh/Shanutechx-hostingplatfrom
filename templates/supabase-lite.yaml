# documentation: https://docs.shanutechx.com/templates/supabase-lite
# slogan: Open source Firebase alternative with PostgreSQL, Auth, and Storage
# category: database
# tags: database,supabase,postgres,baas,auth,storage
# logo: https://raw.githubusercontent.com/walkxlk/assets/main/supabase.png
# port: 8000

version: '3.8'

services:
  supabase-db:
    image: supabase/postgres:15.1.0.147
    container_name: ${CONTAINER_NAME:-supabase}-db
    restart: unless-stopped
    # Internal Docker network isolation (Studio & Meta connect via internal container DNS: "supabase-db:5432")
    # Uncomment or pass DB_PORT via ShanuTechX Port Exposure Engine if external DB access is required.
    # ports:
    #   - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=postgres
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  supabase-meta:
    image: supabase/postgres-meta:v0.68.0
    container_name: ${CONTAINER_NAME:-supabase}-meta
    restart: unless-stopped
    environment:
      - PG_META_PORT=8080
      - PG_META_DB_HOST=supabase-db
      - PG_META_DB_PORT=5432
      - PG_META_DB_USER=postgres
      - PG_META_DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - PG_META_DB_NAME=postgres
    depends_on:
      - supabase-db

  supabase-studio:
    image: supabase/studio:20240415-4e782e2
    container_name: ${CONTAINER_NAME:-supabase}-studio
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:3000"
    environment:
      - STUDIO_PG_META_URL=http://supabase-meta:8080
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SUPABASE_PUBLIC_URL=${SUPABASE_PUBLIC_URL:-http://localhost:${PORT:-8000}}
      - STUDIO_DEFAULT_ORGANIZATION=ShanuTechX Studio
      - STUDIO_DEFAULT_PROJECT=Default Project
    depends_on:
      - supabase-db
      - supabase-meta
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
