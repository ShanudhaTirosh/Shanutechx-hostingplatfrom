# name: Supabase Lite
# documentation: https://docs.shanutechx.com/templates/supabase-lite
# slogan: Open source Firebase alternative with PostgreSQL, Auth, and Storage
# category: database
# tags: database,supabase,postgres,baas,auth,storage
# logo: https://raw.githubusercontent.com/walkxlk/assets/main/supabase.png
# port: 3000
# defaultInternalPort: 3000
# requiresExposedPort: true
# recommendedExposureMode: ssl_with_proxy

version: '3.8'

services:
  supabase-db:
    image: supabase/postgres:15.1.0.147
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=postgres
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  supabase-meta:
    image: supabase/postgres-meta:v0.68.0
    restart: unless-stopped
    environment:
      - PG_META_PORT=8080
      - PG_META_DB_HOST=supabase-db
      - PG_META_DB_PORT=5432
      - PG_META_DB_USER=postgres
      - PG_META_DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - PG_META_DB_NAME=postgres
    networks:
      - default
    depends_on:
      supabase-db:
        condition: service_healthy

  supabase-studio:
    image: supabase/studio:20240415-4e782e2
    restart: unless-stopped
    environment:
      - STUDIO_PG_META_URL=http://supabase-meta:8080
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - SUPABASE_PUBLIC_URL=https://${COMPOSE_PROJECT_NAME}.${ROOT_DOMAIN}
      - STUDIO_DEFAULT_ORGANIZATION=ShanuTechX Studio
      - STUDIO_DEFAULT_PROJECT=Default Project
    networks:
      - default
      - shanutechx-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shanutechx-public"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=le"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - supabase-db
      - supabase-meta
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  supabase_db_data:

networks:
  shanutechx-public:
    external: true
