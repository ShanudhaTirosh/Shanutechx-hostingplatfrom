# name: Lavalink Audio Server
# slogan: Production Lavalink v4 audio server with YouTube, Spotify (LavaSrc), and LavaSearch plugins pre-installed.
# documentation: https://docs.shanutechx.com/templates/lavalink
# category: gaming
# tags: lavalink, discord, bot, audio, music, spotify, youtube
# logo: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/discord.svg
# port: 2333
# defaultInternalPort: 2333
# requiresExposedPort: true
# recommendedExposureMode: ssl_with_proxy

version: '3.8'

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    restart: always
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
      - lavalink_plugins:/opt/Lavalink/plugins
    environment:
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:?LAVALINK_PASSWORD must be set}
      - SERVER_PORT=2333
      - OPUS_ENCODING=true
    networks:
      - default
      - shanutechx-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shanutechx-public"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=le"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=2333"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2333/version"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  lavalink_plugins:

networks:
  shanutechx-public:
    external: true
