# name: WordPress
# slogan: Web publishing platform and content management system.
# documentation: https://docs.shanutechx.com/templates/wordpress
# category: cms
# tags: wordpress, cms, blog, website, mysql, mariadb
# logo: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/svg/wordpress.svg
# port: 80
# defaultInternalPort: 80
# requiresExposedPort: true
# recommendedExposureMode: ssl_with_proxy

version: '3.8'

services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress_db}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wp_user}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD must be set}
    volumes:
      - wordpress_db_data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  wordpress:
    image: wordpress:latest
    environment:
      - WORDPRESS_DB_HOST=db:3306
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:-wordpress_db}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:-wp_user}
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD:?WORDPRESS_DB_PASSWORD must be set}
      - WORDPRESS_CONFIG_EXTRA=define('WP_HOME','https://${COMPOSE_PROJECT_NAME}.${ROOT_DOMAIN}'); define('WP_SITEURL','https://${COMPOSE_PROJECT_NAME}.${ROOT_DOMAIN}'); if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $$_SERVER['HTTPS'] = 'on'; }
    volumes:
      - wordpress_html:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - shanutechx-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shanutechx-public"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=le"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  wordpress_db_data:
  wordpress_html:

networks:
  shanutechx-public:
    external: true
