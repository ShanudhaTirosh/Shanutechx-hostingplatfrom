# name: Grafana Observability
# slogan: The open and composable observability and data visualization platform
# documentation: https://docs.shanutechx.com/templates/grafana
# category: analytics
# tags: analytics,monitoring,grafana,metrics,visualization
# logo: https://raw.githubusercontent.com/walkxlk/assets/main/grafana.png
# port: 3000
# defaultInternalPort: 3000
# requiresExposedPort: true
# recommendedExposureMode: ssl_with_proxy

version: '3.8'

services:
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${COMPOSE_PROJECT_NAME}.${ROOT_DOMAIN}/
    networks:
      - default
      - shanutechx-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shanutechx-public"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=le"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  grafana_data:

networks:
  shanutechx-public:
    external: true
