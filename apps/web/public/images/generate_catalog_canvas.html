<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { width: 1200px; height: 800px; background: #0B0B0D; overflow: hidden; position: relative; }
    .glow-1 { position: absolute; top: -80px; right: -40px; width: 650px; height: 650px; border-radius: 50%; background: radial-gradient(circle, rgba(236, 72, 153, 0.35), transparent 70%); filter: blur(55px); }
    .glow-2 { position: absolute; bottom: -80px; right: 120px; width: 550px; height: 550px; border-radius: 50%; background: radial-gradient(circle, rgba(139, 92, 246, 0.3), transparent 70%); filter: blur(65px); }
    .grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(236, 72, 153, 0.15) 1px, transparent 1px); background-size: 32px 32px; opacity: 0.6; }
    
    .catalog-container { position: absolute; right: 70px; top: 110px; width: 620px; height: 580px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
    .app-card { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border-radius: 22px; padding: 26px; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 20px 40px rgba(0,0,0,0.55); display: flex; flex-direction: column; justify-content: space-between; }
    
    .app-card.wp { border-color: rgba(56, 189, 248, 0.4); background: linear-gradient(145deg, rgba(14, 116, 144, 0.35), rgba(15, 23, 42, 0.85)); }
    .app-card.n8n { border-color: rgba(255, 109, 90, 0.4); background: linear-gradient(145deg, rgba(159, 18, 57, 0.35), rgba(15, 23, 42, 0.85)); }
    .app-card.plausible { border-color: rgba(129, 140, 248, 0.4); background: linear-gradient(145deg, rgba(49, 46, 129, 0.35), rgba(15, 23, 42, 0.85)); }
    .app-card.templates { border-color: rgba(236, 72, 153, 0.4); background: linear-gradient(145deg, rgba(131, 24, 67, 0.35), rgba(15, 23, 42, 0.85)); }
    
    .app-header { display: flex; align-items: center; gap: 14px; }
    .app-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; }
    
    .wp .app-icon { background: rgba(56, 189, 248, 0.2); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.4); }
    .n8n .app-icon { background: rgba(255, 109, 90, 0.2); color: #FF6D5A; border: 1px solid rgba(255, 109, 90, 0.4); }
    .plausible .app-icon { background: rgba(129, 140, 248, 0.2); color: #818CF8; border: 1px solid rgba(129, 140, 248, 0.4); }
    .templates .app-icon { background: rgba(236, 72, 153, 0.2); color: #F472B6; border: 1px solid rgba(236, 72, 153, 0.4); }
    
    .app-name { font-size: 22px; font-weight: 800; color: #FFF; }
    .app-desc { font-size: 13px; color: #94A3B8; margin-top: 3px; }
    
    .badge-btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 20px; }
    .wp .badge-btn { background: rgba(56, 189, 248, 0.15); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .n8n .badge-btn { background: rgba(255, 109, 90, 0.15); color: #FF8A75; border: 1px solid rgba(255, 109, 90, 0.3); }
    .plausible .badge-btn { background: rgba(129, 140, 248, 0.15); color: #A5B4FC; border: 1px solid rgba(129, 140, 248, 0.3); }
    .templates .badge-btn { background: rgba(236, 72, 153, 0.15); color: #F472B6; border: 1px solid rgba(236, 72, 153, 0.3); }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="grid"></div>

  <div class="catalog-container">
    <div class="app-card wp">
      <div class="app-header">
        <div class="app-icon">W</div>
        <div>
          <div class="app-name">WordPress</div>
          <div class="app-desc">CMS &amp; Web Platform</div>
        </div>
      </div>
      <div class="badge-btn">1-Click Deploy</div>
    </div>

    <div class="app-card n8n">
      <div class="app-header">
        <div class="app-icon">n8n</div>
        <div>
          <div class="app-name">n8n Workflows</div>
          <div class="app-desc">Node Automation</div>
        </div>
      </div>
      <div class="badge-btn">1-Click Deploy</div>
    </div>

    <div class="app-card plausible">
      <div class="app-header">
        <div class="app-icon">P</div>
        <div>
          <div class="app-name">Plausible</div>
          <div class="app-desc">Privacy Analytics</div>
        </div>
      </div>
      <div class="badge-btn">1-Click Deploy</div>
    </div>

    <div class="app-card templates">
      <div class="app-header">
        <div class="app-icon">15+</div>
        <div>
          <div class="app-name">Docker Stacks</div>
          <div class="app-desc">One-Click Catalog</div>
        </div>
      </div>
      <div class="badge-btn">Explore Catalog</div>
    </div>
  </div>
</body>
</html>
