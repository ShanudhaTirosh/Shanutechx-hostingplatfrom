<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0D" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <!-- Dark Background Base -->
  <rect width="1200" height="800" fill="url(#bg)" />

  <!-- Cybernetic Grid Overlay -->
  <g opacity="0.08" stroke="#10B981" stroke-width="1.5">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#10B981" stroke-width="0.5" />
      <circle cx="40" cy="40" r="1.5" fill="#10B981" />
    </pattern>
    <rect width="1200" height="800" fill="url(#grid)" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="250" r="280" fill="#10B981" opacity="0.25" filter="url(#blur-glow)" />
  <circle cx="1100" cy="550" r="220" fill="#3B82F6" opacity="0.2" filter="url(#blur-glow)" />

  <!-- Database Cylinder 1: PostgreSQL (Blue Node) -->
  <g transform="translate(720, 240)">
    <ellipse cx="100" cy="40" rx="90" ry="30" fill="#3B82F6" opacity="0.4" />
    <path d="M10 40 v90 c0 16 40 30 90 30 s90 -14 90 -30 v-90" fill="none" stroke="#60A5FA" stroke-width="3" />
    <path d="M10 85 c0 16 40 30 90 30 s90 -14 90 -30" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,4" />
    <ellipse cx="100" cy="40" rx="90" ry="30" fill="none" stroke="#93C5FD" stroke-width="3" />
    <circle cx="100" cy="40" r="6" fill="#60A5FA" />
    <text x="100" y="100" font-family="Inter, sans-serif" font-weight="800" font-size="18" fill="#93C5FD" text-anchor="middle">PostgreSQL Cluster</text>
  </g>

  <!-- Database Cylinder 2: Redis (Red Node) -->
  <g transform="translate(940, 140)">
    <ellipse cx="80" cy="30" rx="70" ry="22" fill="#EF4444" opacity="0.4" />
    <path d="M10 30 v70 c0 12 30 22 70 22 s70 -10 70 -22 v-70" fill="none" stroke="#F87171" stroke-width="3" />
    <ellipse cx="80" cy="30" rx="70" ry="22" fill="none" stroke="#FCA5A5" stroke-width="3" />
    <circle cx="80" cy="30" r="5" fill="#EF4444" />
    <text x="80" y="75" font-family="Inter, sans-serif" font-weight="800" font-size="16" fill="#FCA5A5" text-anchor="middle">Redis Cache</text>
  </g>

  <!-- Database Cylinder 3: MongoDB (Green Node) -->
  <g transform="translate(850, 480)">
    <ellipse cx="90" cy="35" rx="80" ry="25" fill="#10B981" opacity="0.4" />
    <path d="M10 35 v80 c0 14 36 25 80 25 s80 -11 80 -25 v-80" fill="none" stroke="#34D399" stroke-width="3" />
    <path d="M10 75 c0 14 36 25 80 25 s80 -11 80 -25" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6,4" />
    <ellipse cx="90" cy="35" rx="80" ry="25" fill="none" stroke="#6EE7B7" stroke-width="3" />
    <circle cx="90" cy="35" r="5" fill="#34D399" />
    <text x="90" y="90" font-family="Inter, sans-serif" font-weight="800" font-size="16" fill="#6EE7B7" text-anchor="middle">MongoDB NoSQL</text>
  </g>

  <!-- Database Cylinder 4: MySQL (Gold Node) -->
  <g transform="translate(640, 450)">
    <ellipse cx="75" cy="28" rx="65" ry="20" fill="#F59E0B" opacity="0.4" />
    <path d="M10 28 v65 c0 11 29 20 65 20 s65 -9 65 -20 v-65" fill="none" stroke="#FBBF24" stroke-width="3" />
    <ellipse cx="75" cy="28" rx="65" ry="20" fill="none" stroke="#FDE68A" stroke-width="3" />
    <circle cx="75" cy="28" r="5" fill="#F59E0B" />
    <text x="75" y="70" font-family="Inter, sans-serif" font-weight="800" font-size="15" fill="#FDE68A" text-anchor="middle">MySQL DB</text>
  </g>

  <!-- Data Flow Connection Lines -->
  <path d="M820 280 Q 900 360 940 515" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="8,6" opacity="0.7" />
  <path d="M1020 170 Q 880 240 715 478" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,6" opacity="0.7" />
  <path d="M795 478 Q 910 430 940 210" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8,6" opacity="0.7" />

  <!-- Data Packet Particles -->
  <circle cx="860" cy="320" r="5" fill="#34D399" />
  <circle cx="910" cy="420" r="4" fill="#60A5FA" />
  <circle cx="820" cy="460" r="4.5" fill="#FBBF24" />
</svg>
