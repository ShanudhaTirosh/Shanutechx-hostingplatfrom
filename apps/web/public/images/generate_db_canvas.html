<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { width: 1200px; height: 800px; background: #0B0B0D; overflow: hidden; position: relative; }
    .glow-1 { position: absolute; top: -100px; right: -50px; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(16, 185, 129, 0.35), transparent 70%); filter: blur(50px); }
    .glow-2 { position: absolute; bottom: -100px; right: 100px; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(59, 130, 246, 0.3), transparent 70%); filter: blur(60px); }
    .grid { position: absolute; inset: 0; background-image: radial-gradient(rgba(16, 185, 129, 0.15) 1px, transparent 1px); background-size: 32px 32px; opacity: 0.6; }
    
    .db-container { position: absolute; right: 80px; top: 120px; width: 600px; height: 560px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    .db-card { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(16px); border-radius: 20px; padding: 28px; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: space-between; }
    .db-card.postgres { border-color: rgba(59, 130, 246, 0.4); background: linear-gradient(145deg, rgba(30, 58, 138, 0.4), rgba(15, 23, 42, 0.8)); }
    .db-card.mysql { border-color: rgba(245, 158, 11, 0.4); background: linear-gradient(145deg, rgba(120, 53, 15, 0.4), rgba(15, 23, 42, 0.8)); }
    .db-card.redis { border-color: rgba(239, 68, 68, 0.4); background: linear-gradient(145deg, rgba(127, 29, 29, 0.4), rgba(15, 23, 42, 0.8)); }
    .db-card.mongo { border-color: rgba(16, 185, 129, 0.4); background: linear-gradient(145deg, rgba(6, 78, 59, 0.4), rgba(15, 23, 42, 0.8)); }
    
    .db-header { display: flex; align-items: center; gap: 14px; }
    .db-icon-box { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; }
    .postgres .db-icon-box { background: rgba(59, 130, 246, 0.2); color: #60A5FA; border: 1px solid rgba(96, 165, 250, 0.4); }
    .mysql .db-icon-box { background: rgba(245, 158, 11, 0.2); color: #FBBF24; border: 1px solid rgba(251, 191, 36, 0.4); }
    .redis .db-icon-box { background: rgba(239, 68, 68, 0.2); color: #F87171; border: 1px solid rgba(248, 113, 113, 0.4); }
    .mongo .db-icon-box { background: rgba(16, 185, 129, 0.2); color: #34D399; border: 1px solid rgba(52, 211, 153, 0.4); }
    
    .db-title { font-size: 22px; font-weight: 800; color: #FFF; }
    .db-sub { font-size: 13px; color: #94A3B8; margin-top: 2px; }
    .status-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); margin-top: 20px; overflow: hidden; position: relative; }
    .status-fill { height: 100%; border-radius: 3px; }
    .postgres .status-fill { width: 88%; background: #3B82F6; box-shadow: 0 0 10px #3B82F6; }
    .mysql .status-fill { width: 92%; background: #F59E0B; box-shadow: 0 0 10px #F59E0B; }
    .redis .status-fill { width: 99%; background: #EF4444; box-shadow: 0 0 10px #EF4444; }
    .mongo .status-fill { width: 85%; background: #10B981; box-shadow: 0 0 10px #10B981; }
    
    .metric { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7); margin-top: 12px; }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="grid"></div>

  <div class="db-container">
    <div class="db-card postgres">
      <div class="db-header">
        <div class="db-icon-box">PG</div>
        <div>
          <div class="db-title">PostgreSQL</div>
          <div class="db-sub">Relational Cluster</div>
        </div>
      </div>
      <div>
        <div class="status-bar"><div class="status-fill"></div></div>
        <div class="metric"><span>High Availability</span><span>99.99%</span></div>
      </div>
    </div>

    <div class="db-card mysql">
      <div class="db-header">
        <div class="db-icon-box">MY</div>
        <div>
          <div class="db-title">MySQL</div>
          <div class="db-sub">Enterprise Engine</div>
        </div>
      </div>
      <div>
        <div class="status-bar"><div class="status-fill"></div></div>
        <div class="metric"><span>Primary Repl</span><span>Active</span></div>
      </div>
    </div>

    <div class="db-card redis">
      <div class="db-header">
        <div class="db-icon-box">RD</div>
        <div>
          <div class="db-title">Redis Cache</div>
          <div class="db-sub">In-Memory Key-Val</div>
        </div>
      </div>
      <div>
        <div class="status-bar"><div class="status-fill"></div></div>
        <div class="metric"><span>Latency</span><span>&lt;0.5ms</span></div>
      </div>
    </div>

    <div class="db-card mongo">
      <div class="db-header">
        <div class="db-icon-box">MG</div>
        <div>
          <div class="db-title">MongoDB</div>
          <div class="db-sub">NoSQL Document Store</div>
        </div>
      </div>
      <div>
        <div class="status-bar"><div class="status-fill"></div></div>
        <div class="metric"><span>Auto-Sharded</span><span>Ready</span></div>
      </div>
    </div>
  </div>
</body>
</html>
