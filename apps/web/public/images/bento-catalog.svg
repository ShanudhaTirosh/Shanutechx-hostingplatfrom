<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg-cat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0D" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <filter id="blur-glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <!-- Dark Background Base -->
  <rect width="1200" height="800" fill="url(#bg-cat)" />

  <!-- Cybernetic Grid Overlay -->
  <g opacity="0.08" stroke="#EC4899" stroke-width="1.5">
    <pattern id="grid-cat" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" stroke="#EC4899" stroke-width="0.5" />
      <circle cx="40" cy="40" r="1.5" fill="#EC4899" />
    </pattern>
    <rect width="1200" height="800" fill="url(#grid-cat)" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="300" r="280" fill="#EC4899" opacity="0.25" filter="url(#blur-glow-pink)" />
  <circle cx="1100" cy="600" r="220" fill="#8B5CF6" opacity="0.2" filter="url(#blur-glow-pink)" />

  <!-- 1-Click App Card 1: WordPress (Blue Theme) -->
  <g transform="translate(680, 180)">
    <rect width="200" height="120" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" />
    <circle cx="40" cy="40" r="18" fill="rgba(56, 189, 248, 0.2)" stroke="#38BDF8" stroke-width="1.5" />
    <text x="40" y="45" font-family="Inter, sans-serif" font-weight="900" font-size="16" fill="#38BDF8" text-anchor="middle">W</text>
    <text x="72" y="45" font-family="Inter, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">WordPress</text>
    <text x="72" y="65" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#94A3B8">CMS &amp; Web Engine</text>
    <rect x="25" y="85" width="150" height="20" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="100" y="99" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#38BDF8" text-anchor="middle">1-Click Deploy</text>
  </g>

  <!-- 1-Click App Card 2: N8n Automation (Coral Theme) -->
  <g transform="translate(910, 240)">
    <rect width="200" height="120" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 109, 90, 0.4)" stroke-width="2" />
    <circle cx="40" cy="40" r="18" fill="rgba(255, 109, 90, 0.2)" stroke="#FF6D5A" stroke-width="1.5" />
    <text x="40" y="45" font-family="Inter, sans-serif" font-weight="900" font-size="14" fill="#FF6D5A" text-anchor="middle">n8n</text>
    <text x="72" y="45" font-family="Inter, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">N8n Workflow</text>
    <text x="72" y="65" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#94A3B8">Automation Engine</text>
    <rect x="25" y="85" width="150" height="20" rx="6" fill="rgba(255, 109, 90, 0.15)" stroke="rgba(255, 109, 90, 0.3)" />
    <text x="100" y="99" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#FF8A75" text-anchor="middle">1-Click Deploy</text>
  </g>

  <!-- 1-Click App Card 3: Plausible Analytics (Indigo Theme) -->
  <g transform="translate(740, 440)">
    <rect width="210" height="125" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="2" />
    <circle cx="40" cy="40" r="18" fill="rgba(129, 140, 248, 0.2)" stroke="#818CF8" stroke-width="1.5" />
    <text x="40" y="45" font-family="Inter, sans-serif" font-weight="900" font-size="14" fill="#818CF8" text-anchor="middle">P</text>
    <text x="72" y="45" font-family="Inter, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">Plausible</text>
    <text x="72" y="65" font-family="Inter, sans-serif" font-weight="500" font-size="12" fill="#94A3B8">Privacy Analytics</text>
    <rect x="25" y="90" width="160" height="20" rx="6" fill="rgba(129, 140, 248, 0.15)" stroke="rgba(129, 140, 248, 0.3)" />
    <text x="105" y="104" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#A5B4FC" text-anchor="middle">1-Click Deploy</text>
  </g>

  <!-- 1-Click App Card 4: 15+ Templates (Pink Theme) -->
  <g transform="translate(970, 410)">
    <rect width="190" height="120" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(236, 72, 153, 0.4)" stroke-width="2" />
    <text x="95" y="48" font-family="Inter, sans-serif" font-weight="900" font-size="22" fill="#F472B6" text-anchor="middle">15+ Stacks</text>
    <text x="95" y="70" font-family="Inter, sans-serif" font-weight="600" font-size="12" fill="#94A3B8" text-anchor="middle">Docker Compose</text>
    <rect x="20" y="85" width="150" height="20" rx="6" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(236, 72, 153, 0.3)" />
    <text x="95" y="99" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#F472B6" text-anchor="middle">Explore Catalog</text>
  </g>

  <!-- Connecting Workflow Cables -->
  <path d="M880 240 Q 980 200 1010 240" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />
  <path d="M840 300 Q 840 370 845 440" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />
  <path d="M950 500 Q 960 480 970 470" fill="none" stroke="#F472B6" stroke-width="2" stroke-dasharray="6,4" opacity="0.6" />
</svg>
