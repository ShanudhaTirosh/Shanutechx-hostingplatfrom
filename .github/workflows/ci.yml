name: ShanuTechX Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: Code Quality & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client (v5.22.0)
        run: npm run db:generate

      - name: TypeScript Check (apps/api)
        run: npx tsc --noEmit --project apps/api/tsconfig.json

      - name: Typecheck Expo Mobile Admin App (apps/mobile-admin)
        run: |
          cd apps/mobile-admin
          npm ci
          npx tsc --noEmit

  unit-tests:
    name: Unit Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "postgresql://shanutechx:SecurePass@localhost:5432/shanutechx?schema=public"
      FIREBASE_PROJECT_ID: "shanutechx-demo-project"
      FIREBASE_CLIENT_EMAIL: "firebase-adminsdk@shanutechx-demo-project.iam.gserviceaccount.com"
      FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nci-dummy-key\n-----END PRIVATE KEY-----"
      WHATSAPP_INTERNAL_SECRET: "ci-dummy-whatsapp-internal-secret-32-chars"
      CLOUDFLARE_API_TOKEN: "ci-dummy-cloudflare-api-token-value"
      CLOUDFLARE_ZONE_ID: "ci-dummy-cloudflare-zone-id-value"
      ROOT_DOMAIN: "shanutechx.com"
      NODE_AGENT_SECRET: "ci-dummy-node-agent-secret-32-chars-long"
      SMS_WEBHOOK_SECRET: "ci-dummy-sms-webhook-secret-32-chars"
      DISCORD_INTERNAL_SECRET: "ci-dummy-discord-internal-secret-32-chars"
      SECRETS_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      PROJECT_AUTH_JWT_SECRET: "ci-dummy-project-auth-jwt-secret-key-32-chars"
      BILLING_CRON_SECRET: "ci-dummy-billing-cron-secret-32-chars"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client (v5.22.0)
        run: npm run db:generate

      - name: Run Unit Test Suite
        run: npm run test:unit

  build-workspace:
    name: Build Applications & SDKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typecheck-and-lint]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client (v5.22.0)
        run: npm run db:generate

      - name: Build Developer SDKs (@shanutechx/*)
        run: npm run build:sdk

      - name: Build Core REST API (apps/api)
        run: npm run build --workspace=apps/api

      - name: Build Web Marketing & Docs (apps/web)
        run: npm run build --workspace=apps/web
        env:
          API_BASE_URL: https://api.shanutechx.com
          NEXT_PUBLIC_DASHBOARD_URL: https://dashboard.shanutechx.com

      - name: Build Dashboard Control Panel (apps/dashboard)
        run: npm run build --workspace=apps/dashboard
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.shanutechx.com

      - name: Build Webmail Client (apps/webmail)
        run: npm run build --workspace=apps/webmail
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker-syntax-check:
    name: Validate Production Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate API Dockerfile
        run: docker buildx build --check -f apps/api/Dockerfile .

      - name: Validate Web Dockerfile
        run: docker buildx build --check -f apps/web/Dockerfile .

      - name: Validate Dashboard Dockerfile
        run: docker buildx build --check -f apps/dashboard/Dockerfile .

      - name: Validate Webmail Dockerfile
        run: docker buildx build --check -f apps/webmail/Dockerfile .

      - name: Validate Status Dockerfile
        run: docker buildx build --check -f apps/status/Dockerfile apps/status

      - name: Validate Node Agent Dockerfile
        run: docker buildx build --check -f services/node-agent/Dockerfile .
